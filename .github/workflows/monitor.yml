name: Monitor 141

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Run monitor
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          ENABLE_MOMTAZ: ${{ secrets.ENABLE_MOMTAZ }}
          ENABLE_141_OBSTRUCTIONS: ${{ secrets.ENABLE_141_OBSTRUCTIONS }}
          ENABLE_141_STATE: ${{ secrets.ENABLE_141_STATE }}
          ENABLE_141_POLICE: ${{ secrets.ENABLE_141_POLICE }}
        run: |
          python monitor.py

      - name: Commit state
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last_status.json obstruction_status.json roads_state_141.json police_restrictions_141.json
          git diff --cached --quiet && exit 0
          git commit -m "Update last status"
          git push
